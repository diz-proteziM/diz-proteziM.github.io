<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Yönlendiriliyor...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var isAppPath = l.pathname.startsWith('/app');
      
      if (isAppPath) {
        var pathSegmentsToKeep = 1; // '/app' subdirectory
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } else {
        // Fallback for non-app invalid routes: redirect cleanly to homepage
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
